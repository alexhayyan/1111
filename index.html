<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>BOT-T — Игровой магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#202633;font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e8ee;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900;color:#2580c8}.logo span{color:#333}.cart{border:0;background:#3478f6;color:#fff;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:18px 14px 50px}.hero{background:linear-gradient(135deg,#172033,#2c3c60);color:white;border-radius:20px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:34px}.hero p{margin:0;color:#d4dceb}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid #e2e6ed;background:#fff;border-radius:11px;padding:10px 14px;font-weight:700;color:#626c7f;cursor:pointer}.tab.active{background:#3478f6;color:#fff;border-color:#3478f6}.section{margin:25px 0}.title{font-size:23px;font-weight:900;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{background:#fff;border:1px solid #e3e7ed;border-radius:15px;padding:15px;display:flex;flex-direction:column;min-height:175px}.icon{font-size:27px;margin-bottom:10px}.card h3{font-size:15px;line-height:1.25;margin:0 0 5px}.desc{font-size:12px;color:#7c8595;margin-top:auto}.price{font-size:20px;font-weight:900;margin:12px 0 9px}.buy{border:0;border-radius:10px;padding:10px;background:#3478f6;color:#fff;font-weight:800;cursor:pointer}.modal{display:none;position:fixed;inset:0;z-index:50;background:#0009;backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(430px,100%);background:#fff;border-radius:20px;padding:23px;box-shadow:0 25px 70px #0008}.top{display:flex;justify-content:space-between;gap:15px}.close{border:0;background:#eef1f5;border-radius:9px;width:36px;height:36px;font-size:20px;cursor:pointer}.box h2{margin:0 0 5px}.selected{font-size:13px;color:#778196;margin-bottom:18px}.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:800;color:#697387;margin-bottom:5px;text-transform:uppercase}.field input{width:100%;padding:13px;border:1px solid #dce1e9;border-radius:10px;outline:none;font-size:15px}.submit,.ok{width:100%;border:0;border-radius:11px;padding:13px;background:#ff713b;color:#fff;font-weight:900;margin-top:8px;cursor:pointer}.submit:disabled{opacity:.6}.success{text-align:center;padding:8px}.check{width:65px;height:65px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#e8faef;color:#22ad70;font-size:34px;font-weight:900}.success p{color:#778196;line-height:1.5}.ok{background:#3478f6}.error{background:#fff0f0;color:#b42318;padding:12px;border-radius:10px;margin-top:12px;font-size:13px;line-height:1.4}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.hero h1{font-size:27px}.grid{gap:8px}.card{padding:12px;min-height:165px}.card h3{font-size:14px}.price{font-size:18px}}
</style>
</head>
<body>
<header class="header"><div class="logo">BOT<span>-T</span></div><button class="cart" id="cart">🛒 Заказ</button></header>
<main class="wrap"><section class="hero"><h1>Игровой магазин</h1><p>Выберите игру и товар — оформите заказ за несколько секунд.</p></section><div class="tabs" id="tabs"></div><div id="catalog"></div></main>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
const API_URL = "__API_URL__";
const data=[
 {g:"Brawl Stars",i:"⭐",p:[["Brawl Pass",649],["Brawl Pass Plus",899],["Brawl Pass (особая акция)",349],["Улучшение до Brawl Pass Plus",449],["30 гемов",229],["80 гемов",499],["170 гемов",949],["360 гемов",1749],["950 гемов",4199],["2000 гемов",7999],["Ранний доступ Луми",2049],["5000 блингoв",249],["10000 блингoв",519],["Pro Pass",2099]]},
 {g:"Clash Royale",i:"👑",p:[["80 гемов",149],["500 гемов",549],["1200 гемов",1090],["2500 гемов",2049],["6500 гемов",4799],["14000 гемов",9799],["Алмазный пропуск",1249]]},
 {g:"PUBG Mobile",i:"🎮",p:[["60 UC",110],["120 UC",220],["180 UC",300],["325 UC",470],["385 UC",565],["660 UC",870],["720 UC",965],["985 UC",1340],["1045 UC",1435],["1320 UC",1740],["1800 UC",2300],["1920 UC",2480],["3850 UC",4450],["8100 UC",8500],["16200 UC",17000],["32400 UC",34000]]}
];
let filter="Все",selected=null;const tabs=document.getElementById("tabs"),cat=document.getElementById("catalog"),modal=document.getElementById("modal");
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();document.documentElement.style.setProperty('--tg-bg',tg.themeParams?.bg_color||'#fff');}
const money=x=>x==null?"Цена уточняется":x.toLocaleString("ru-RU")+" ₽";
function render(){tabs.innerHTML=["Все",...data.map(x=>x.g)].map(x=>`<button class="tab ${x==filter?"active":""}" onclick="setFilter(${JSON.stringify(x)})">${x}</button>`).join("");const arr=filter=="Все"?data:data.filter(x=>x.g==filter);cat.innerHTML=arr.map(x=>`<section class="section"><h2 class="title">${x.i} ${x.g}</h2><div class="grid">${x.p.map(p=>`<article class="card"><div class="icon">${x.i}</div><h3>${p[0]}</h3><div class="desc">Моментальное оформление</div><div class="price">${money(p[1])}</div><button class="buy" onclick='order(${JSON.stringify(x.g)},${JSON.stringify(p[0])},${p[1]===null?"null":p[1]})'>Заказать</button></article>`).join("")}</div></section>`).join("")}
function setFilter(x){filter=x;render();window.scrollTo({top:0,behavior:"smooth"})}
function order(g,p,price){selected={g,p,price};modal.classList.add("show");document.getElementById("box").innerHTML=`<div class="top"><div><h2>Оформление заказа</h2><div class="selected">${g} • ${p} • ${money(price)}</div></div><button class="close" onclick="closeModal()">×</button></div><form id="form"><div class="field"><label>Ваше имя</label><input id="name" required placeholder="Иван" autocomplete="name"></div><div class="field"><label>Telegram</label><input id="tgname" required placeholder="@username" autocomplete="username"></div><button class="submit" id="submitBtn">Оформить заказ</button><div id="error"></div></form>`;document.getElementById("form").onsubmit=submitOrder;setTimeout(()=>document.getElementById("name").focus(),50)}
async function submitOrder(e){e.preventDefault();const name=document.getElementById("name").value.trim(),telegram=document.getElementById("tgname").value.trim(),btn=document.getElementById("submitBtn"),error=document.getElementById("error");if(!name||!telegram)return;btn.disabled=true;btn.textContent="Отправляем...";error.innerHTML="";
 const payload={type:"order",game:selected.g,product:selected.p,price:selected.price,name,telegram,initData:tg?.initData||""};
 try{const r=await fetch(API_URL+"/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Не удалось отправить заявку");document.getElementById("box").innerHTML=`<div class="success"><div class="check">✓</div><h2>Заказ оформлен!</h2><p>Наш менеджер скоро свяжется с вами.</p><button class="ok" onclick="closeModal()">Готово</button></div>`;if(tg){try{tg.HapticFeedback?.notificationOccurred('success')}catch(_){}}}catch(err){btn.disabled=false;btn.textContent="Оформить заказ";error.innerHTML=`<div class="error">${escapeHtml(err.message)}<br>Попробуйте ещё раз.</div>`}}
function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function closeModal(){modal.classList.remove("show")};modal.onclick=e=>{if(e.target===modal)closeModal()};document.getElementById("cart").onclick=()=>{if(selected)order(selected.g,selected.p,selected.price);else document.querySelector(".buy")?.click()};render();
</script></body></html>
